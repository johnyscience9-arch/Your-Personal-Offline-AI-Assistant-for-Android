
name: Build Your GPT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - commercial-offline-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Your GPT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Locate SDK Manager
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          adb version
          "$SDKMANAGER" --list_installed

      - name: Verify Project
        shell: bash
        run: |
          set -e

          ls -la

          test -f gradlew

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          echo "Project structure verified!"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL!"
          ls -lh "$APK"

      - name: Upload Your GPT APK
        uses: actions/upload-artifact@v4
        with:
          name: Your-GPT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
