
name: Build Your GPT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Your GPT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Find SDK Manager
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found SDK Manager: $SDKMANAGER"

          SDK_BIN=$(dirname "$SDKMANAGER")
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Verify SDK Manager
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" --version
          adb version

      - name: Verify Project
        shell: bash
        run: |
          set -e
          ls -la
          test -f gradlew
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Project structure OK"

      - name: Build Your GPT APK
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Your-GPT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
